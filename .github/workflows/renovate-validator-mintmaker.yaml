name: renovate-config-validator-mintmaker
on:
  pull_request:
    branches:
      - master
    paths:
      - renovate.jsonc
  push:
    branches:
      - master
    paths:
      - renovate.jsonc

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TEST_IMAGE: quay.io/konflux-ci/mintmaker-renovate-image:latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate renovate.jsonc
        run: |
          podman run \
            --rm \
            -v ./renovate.jsonc:/tmp/renovate.jsonc \
            ${{ env.TEST_IMAGE }} \
            /bin/bash -c 'renovate-config-validator /tmp/renovate.jsonc'
